[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scienceon-mcp"
version = "0.5.0"
description = "MCP server + CLI for KISTI ScienceON OpenAPI — search and collect academic literature metadata"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yeondong Yang" }]
keywords = ["mcp", "scienceon", "kisti", "openapi", "academic", "literature", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "mcp>=1.2.0,<2",  # 상한 필수 — mcp 2.0 에서 mcp.server.fastmcp 제거됨
    "requests>=2.31.0",
    "pycryptodome>=3.20.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "truststore>=0.9",  # 교육망/사내망 SSL 인터셉션 대응(OS 신뢰저장소 사용, 검증 유지)
]

[project.scripts]
scienceon-mcp = "scienceon_mcp.server:main"
scienceon = "scienceon_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/rubatoyd/scienceON-mcp"
Repository = "https://github.com/rubatoyd/scienceON-mcp"
Issues = "https://github.com/rubatoyd/scienceON-mcp/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/scienceon_mcp"]
